# Public membership information plus isolated operator review and protected pilot.

[build]
  # Allowlist public assets; package the pilot HTML/PDF/font privately in its function.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[functions.membership-pilot]
  node_bundler = "esbuild"
  included_files = ["netlify/pilot-private/*"]

# Public submission is gated separately; operator review requires its own credential.
[functions.membership-production]
  node_bundler = "esbuild"
  included_files = ["netlify/pilot-private/*", "netlify/production-private/*"]
